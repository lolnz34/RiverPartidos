<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River Plate | Partidos, horarios y plataformas</title>
<meta name="description" content="Próximos partidos de River Plate: fechas, horarios, canal de TV y plataforma de streaming.">
<meta name="theme-color" content="#c41e3a">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="River Partidos">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="icons/icon-192.png" alt="Escudo" class="brand-icon">
    <div>
      <h1>River Plate</h1>
      <p class="subtitle">Partidos, horarios y plataformas</p>
    </div>
  </div>
  <button id="installBtn" class="install-btn" hidden>Instalar app</button>
</header>

<nav class="filters" id="filters">
  <button class="chip active" data-filter="todos">Todos</button>
  <button class="chip" data-filter="programado">Próximos</button>
  <button class="chip" data-filter="finalizado">Jugados</button>
  <button class="chip" data-filter="favoritos">⭐ Favoritos</button>
</nav>

<main>
  <p id="status" class="status">Cargando partidos...</p>
  <section id="matchList" class="match-list"></section>
</main>

<footer class="footer">
  <p>Datos actualizados: <span id="updatedDate">-</span></p>
  <p class="fine-print">Fuente: coberturas de TV y prensa deportiva. Los horarios y canales pueden cambiar.</p>
</footer>

<template id="matchTemplate">
  <article class="match-card">
    <div class="match-header">
      <span class="competition"></span>
      <button class="fav-btn" aria-label="Marcar como favorito">☆</button>
    </div>
    <div class="teams">
      <span class="team home"></span>
      <span class="vs">vs</span>
      <span class="team away"></span>
    </div>
    <div class="details">
      <div class="detail"><span class="label">📅 Fecha</span><span class="date"></span></div>
      <div class="detail"><span class="label">🕒 Hora</span><span class="time"></span></div>
      <div class="detail"><span class="label">🏟️ Estadio</span><span class="stadium"></span></div>
    </div>
    <div class="platforms">
      <div class="platform-group">
        <span class="label">📺 TV</span>
        <div class="tags tv-tags"></div>
      </div>
      <div class="platform-group">
        <span class="label">📱 Streaming</span>
        <div class="tags streaming-tags"></div>
      </div>
    </div>
    <span class="status-badge"></span>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
